# Alembic config. The database URL deliberately lives in app/db.py, not here --
# alembic/env.py reuses the app's own engine so there is one definition of
# where the database is.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Readable filenames (0001_baseline.py) instead of a bare hash.
file_template = %%(rev)s_%%(slug)s
path_separator = os

# Generated revisions go through the same formatter as everything else, so a
# fresh `alembic revision` doesn't fail CI's `ruff format --check`.
[post_write_hooks]
hooks = ruff_fix,ruff_format
ruff_fix.type = exec
ruff_fix.executable = python
ruff_fix.options = -m ruff check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = python
ruff_format.options = -m ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
